<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Petal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <div class="logo">Petal</div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="catalog.html">Catalog</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <h1 style="text-align: center; margin-bottom: 30px;">contact <span class="highlight">us</span></h1>

        <section class="contact-container">
            <form class="contact-form" action="#" method="POST">
                <h3>Send a Message</h3>
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required placeholder="Jane Doe">

                <label for="email">Your Email</label>
                <input type="email" id="email" name="email" required placeholder="jane@example.com">

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4" required placeholder="How can we help you?"></textarea>

                <button type="submit" class="btn-pill">Send Request</button>
            </form>

            <div>
                <h3>Quick Messengers</h3>
                <p style="margin-top: 10px; margin-bottom: 20px;">Reach out directly via your favorite platform:</p>
                <ul class="messenger-list">
                    <li><a href="#">📷 Instagram: @petal_flowers</a></li>
                    <li><a href="#">💬 Telegram: @petal_support</a></li>
                    <li><a href="#">🟢 WhatsApp: +1 (555) 019-2834</a></li>
                </ul>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-bottom">
            <p>&copy; 2026 Petal Flower Workshop. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
